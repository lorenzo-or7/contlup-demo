<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Página de erro autossuficiente: pode ser servida em qualquer endereço, então não carrega CSS, fontes nem imagens.
     O link de volta usa o endereço oficial do site: ao mudar de domínio, atualize-o junto com o canonical do index.html. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>Página não encontrada | ContLup Studio Contábil</title>
<style>
  :root{color-scheme:dark;--bg:#070C1C;--fg:#EEF0FA;--muted:#9EA6C4;--violet:#7357F0;--lilac:#C6B6FF}
  @media (prefers-color-scheme:light){:root{color-scheme:light;--bg:#F4F3F9;--fg:#0A1130;--muted:#5A6283;--lilac:#4A2FC4}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--fg);font:400 17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:34rem}
  p{margin:0}
  .k{font:500 12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--lilac)}
  h1{margin:14px 0 12px;font:800 clamp(40px,9vw,72px)/.95 "Arial Narrow",Arial,sans-serif;text-transform:uppercase;letter-spacing:-.01em}
  .t{color:var(--muted)}
  a{display:inline-flex;align-items:center;min-height:48px;margin-top:28px;padding:0 24px;border-radius:999px;background:var(--violet);color:#fff;font-weight:600;text-decoration:none}
  a:hover{background:#6247E6}
  a:focus-visible{outline:2px solid var(--lilac);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="k">ContLup Studio Contábil · erro 404</p>
  <h1>Página não encontrada.</h1>
  <p class="t">O endereço pode ter mudado ou foi digitado com algum erro. Tudo o que a ContLup oferece está na página inicial.</p>
  <a href="https://lorenzo-or7.github.io/contlup-demo/">Voltar para a página inicial</a>
</main>
</body>
</html>
